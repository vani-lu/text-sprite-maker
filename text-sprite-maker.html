<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字 SVG 生成器</title>
<style>
  @font-face {
    font-family: 'SetoFont';
    src: url('./setofont/setofont.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  :root {
    --bg: #1b1e2a;
    --panel: #262a3a;
    --panel2: #2e3347;
    --border: #3a4058;
    --text: #eef0f6;
    --muted: #9aa1b5;
    --accent: #e84393;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header { padding: 18px 24px 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 16px;
    padding: 8px 24px 24px;
    align-items: start;
  }
  .panel { background: var(--panel); border-radius: 12px; padding: 16px; }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--muted); margin-bottom: 6px;
  }
  .row label output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type="text"], input[type="number"], select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .font-status { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .canvas-inputs { display: flex; gap: 8px; align-items: center; }
  .canvas-inputs span { color: var(--muted); font-size: 13px; }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row span { font-size: 13px; color: var(--muted); }
  input[type="color"] {
    width: 44px; height: 30px; border: none; background: none; padding: 0; cursor: pointer;
  }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; color: var(--text); font-weight: 400;
  }
  .check-row input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex: none;
  }
  .stage {
    display: flex; overflow: auto;
    min-height: 360px; max-height: 520px;
    padding: 16px; border-radius: 12px;
    background: repeating-conic-gradient(#20242f 0% 25%, #282c3e 0% 50%) 0 0 / 24px 24px;
  }
  .stage svg {
    display: block; flex: none; margin: auto;
    outline: 1px dashed #525a78;
  }
  .stage .hint { color: var(--muted); font-size: 14px; margin: auto; }
  .meta { margin-top: 8px; text-align: center; color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .ghost { background: var(--panel2); color: var(--text); }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre {
    background: #14161f; border-radius: 8px; padding: 12px;
    font-size: 11px; line-height: 1.5; overflow: auto; max-height: 220px; color: #c8cede;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<header>
  <h1>文字 SVG 生成器</h1>
  <p>可选择字体 · 默认居中,viewBox 与精灵一致的 64×64</p>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label>文字内容</label>
      <input type="text" id="text" value="BABA" autocomplete="off">
    </div>
    <div class="row">
      <label for="font">字体</label>
      <select id="font">
        <option value="arial">Arial Rounded MT Bold</option>
        <option value="seto">Seto Font（濑户字体）</option>
      </select>
      <p class="font-status" id="font-status" role="status"></p>
    </div>
    <div class="row">
      <label>画布大小 (宽 × 高)</label>
      <div class="canvas-inputs">
        <input type="number" id="cw" value="64" min="8" max="512">
        <span>×</span>
        <input type="number" id="ch" value="64" min="8" max="512">
      </div>
    </div>
    <div class="row">
      <label>字号 <output id="size-v"></output></label>
      <input type="range" id="size" min="4" max="100" step="0.5" value="20">
    </div>
    <div class="row">
      <label>字符间距 <output id="spacing-v"></output></label>
      <input type="range" id="spacing" min="-2" max="16" step="0.5" value="0">
    </div>
    <div class="row">
      <label>水平位移 <output id="dx-v"></output></label>
      <input type="range" id="dx" min="-32" max="32" step="0.5" value="0">
    </div>
    <div class="row">
      <label>垂直位移 <output id="dy-v"></output></label>
      <input type="range" id="dy" min="-32" max="32" step="0.5" value="0">
    </div>
    <div class="row">
      <label>横向拉伸 <output id="sx-v"></output></label>
      <input type="range" id="sx" min="0.2" max="3" step="0.05" value="1">
    </div>
    <div class="row">
      <label>纵向拉伸 <output id="sy-v"></output></label>
      <input type="range" id="sy" min="0.2" max="3" step="0.05" value="1">
    </div>
    <div class="row">
      <label>颜色</label>
      <div class="color-row">
        <input type="color" id="color" value="#ffffff">
        <span>文字填充色</span>
      </div>
    </div>
    <div class="row">
      <label class="check-row">
        <input type="checkbox" id="path-mode">
        <span>把文字转换成路径（避免依赖字体）</span>
      </label>
    </div>
  </section>
  <section>
    <div class="stage" id="stage"></div>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button class="primary" id="download">下载 SVG</button>
      <button class="ghost" id="copy">复制 SVG 代码</button>
    </div>
    <details>
      <summary>查看 SVG 代码</summary>
      <pre id="code"></pre>
    </details>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const FONTS = {
  arial: "'Arial Rounded MT Bold','Arial Rounded MT','Helvetica Rounded',Arial,sans-serif",
  seto: "'SetoFont',sans-serif",
};
let fontLoading = false;
let fontRequest = 0;

async function selectFont() {
  const request = ++fontRequest;
  fontLoading = $('font').value === 'seto';
  $('font-status').textContent = fontLoading ? '正在加载 Seto Font…' : '';
  render();
  if (!fontLoading) return;
  try {
    await document.fonts.load('20px "SetoFont"');
    if (request !== fontRequest) return;
    $('font-status').textContent = 'Seto Font 已加载。跨设备使用 SVG 时，请勾选转换成路径。';
  } catch (error) {
    if (request !== fontRequest) return;
    $('font').value = 'arial';
    $('font-status').textContent = '无法加载 Seto Font，请确认 setofont/setofont.ttf 存在。已切回 Arial Rounded。';
  }
  fontLoading = false;
  pathCache = { key: '', d: '' };
  render();
}
const RANGE_IDS = ['size', 'spacing', 'dx', 'dy', 'sx', 'sy'];
const ZOOM = 4; // 预览缩放:1 画布单位 = 4px

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let pathCache = { key: '', d: '' };

function getTextPath(text, font, size, spacing, w, h) {
  if (!text) return '';
  const key = `${text}|${font}|${size}|${spacing}|${w}|${h}`;
  if (pathCache.key === key) return pathCache.d;

  const MAX_CANVAS = 2048;
  let SCALE = 8;
  let cw = Math.max(1, Math.floor(w * SCALE));
  let ch = Math.max(1, Math.floor(h * SCALE));
  if (cw > MAX_CANVAS || ch > MAX_CANVAS) {
    SCALE = Math.max(1, Math.floor(MAX_CANVAS / Math.max(w, h)));
    cw = Math.max(1, Math.floor(w * SCALE));
    ch = Math.max(1, Math.floor(h * SCALE));
  }

  const canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#000';
  ctx.font = `${size * SCALE}px ${font}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (typeof ctx.letterSpacing !== 'undefined') {
    ctx.letterSpacing = `${spacing * SCALE}px`;
  }
  ctx.fillText(text, cw / 2, ch / 2);

  const data = ctx.getImageData(0, 0, cw, ch).data;
  const alpha = new Float32Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) {
    alpha[i] = data[i * 4 + 3];
  }

  const contours = marchingSquares(alpha, cw, ch, 128);
  if (!contours.length) {
    pathCache = { key, d: '' };
    return '';
  }

  const d = contours.map(pts => {
    const simplified = rdpSimplify(pts, SCALE * 0.2);
    if (simplified.length < 3) return '';
    const centered = simplified.map(p => ({
      x: (p.x - cw / 2) / SCALE,
      y: (p.y - ch / 2) / SCALE
    }));
    return pointsToSmoothPath(centered);
  }).filter(s => s).join(' ');

  pathCache = { key, d };
  return d;
}

function marchingSquares(alpha, w, h, threshold) {
  const getAlpha = (x, y) => (x < 0 || x >= w || y < 0 || y >= h) ? 0 : alpha[y * w + x];
  const segments = [];
  const pointMap = new Map();

  const keyOf = (p) => `${p.x.toFixed(6)},${p.y.toFixed(6)}`;
  const addSegment = (p1, p2) => {
    const idx = segments.length;
    segments.push([p1, p2]);
    for (let i = 0; i < 2; i++) {
      const k = keyOf(i === 0 ? p1 : p2);
      if (!pointMap.has(k)) pointMap.set(k, []);
      pointMap.get(k).push({ seg: idx, end: i });
    }
  };

  const lerp = (x1, y1, x2, y2, v1, v2) => {
    const t = (threshold - v1) / (v2 - v1);
    return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
  };

  for (let y = 0; y < h - 1; y++) {
    for (let x = 0; x < w - 1; x++) {
      const tl = getAlpha(x, y);
      const tr = getAlpha(x + 1, y);
      const br = getAlpha(x + 1, y + 1);
      const bl = getAlpha(x, y + 1);
      const caseIdx = (tl > threshold ? 8 : 0) | (tr > threshold ? 4 : 0) | (br > threshold ? 2 : 0) | (bl > threshold ? 1 : 0);
      if (caseIdx === 0 || caseIdx === 15) continue;

      const top = lerp(x, y, x + 1, y, tl, tr);
      const right = lerp(x + 1, y, x + 1, y + 1, tr, br);
      const bottom = lerp(x, y + 1, x + 1, y + 1, bl, br);
      const left = lerp(x, y, x, y + 1, tl, bl);
      const edges = [top, right, bottom, left];
      const center = (tl + tr + br + bl) / 4;

      let pairs;
      switch (caseIdx) {
        case 1: pairs = [[3, 2]]; break;
        case 2: pairs = [[2, 1]]; break;
        case 3: pairs = [[3, 1]]; break;
        case 4: pairs = [[1, 0]]; break;
        case 5: pairs = center > threshold ? [[0, 3], [1, 2]] : [[0, 1], [2, 3]]; break;
        case 6: pairs = [[0, 2]]; break;
        case 7: pairs = [[3, 0]]; break;
        case 8: pairs = [[0, 3]]; break;
        case 9: pairs = [[0, 2]]; break;
        case 10: pairs = center > threshold ? [[0, 1], [2, 3]] : [[0, 3], [1, 2]]; break;
        case 11: pairs = [[0, 1]]; break;
        case 12: pairs = [[3, 1]]; break;
        case 13: pairs = [[2, 1]]; break;
        case 14: pairs = [[3, 2]]; break;
      }

      for (const [e1, e2] of pairs) {
        addSegment(edges[e1], edges[e2]);
      }
    }
  }

  const used = new Array(segments.length).fill(false);
  const contours = [];

  for (let i = 0; i < segments.length; i++) {
    if (used[i]) continue;
    const contour = [];
    let segIdx = i;
    let endIdx = 0;

    while (!used[segIdx]) {
      used[segIdx] = true;
      const seg = segments[segIdx];
      contour.push(seg[endIdx]);
      const nextP = seg[1 - endIdx];
      const conns = pointMap.get(keyOf(nextP)) || [];
      let next = null;
      for (const c of conns) {
        if (!used[c.seg]) {
          next = c;
          break;
        }
      }
      if (!next) break;
      segIdx = next.seg;
      endIdx = next.end;
    }

    if (contour.length > 2) contours.push(contour);
  }

  return contours;
}

function pointsToSmoothPath(pts) {
  if (pts.length < 3) return '';
  const fmt = (n) => n.toFixed(2);
  let d = `M ${fmt(pts[0].x)} ${fmt(pts[0].y)}`;

  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[(i - 1 + pts.length) % pts.length];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[(i + 2) % pts.length];

    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;

    d += ` C ${fmt(c1x)} ${fmt(c1y)} ${fmt(c2x)} ${fmt(c2y)} ${fmt(p2.x)} ${fmt(p2.y)}`;
  }

  const last = pts.length - 1;
  const p0 = pts[(last - 1 + pts.length) % pts.length];
  const p1 = pts[last];
  const p2 = pts[0];
  const p3 = pts[1];

  const c1x = p1.x + (p2.x - p0.x) / 6;
  const c1y = p1.y + (p2.y - p0.y) / 6;
  const c2x = p2.x - (p3.x - p1.x) / 6;
  const c2y = p2.y - (p3.y - p1.y) / 6;

  d += ` C ${fmt(c1x)} ${fmt(c1y)} ${fmt(c2x)} ${fmt(c2y)} ${fmt(p2.x)} ${fmt(p2.y)} Z`;
  return d;
}

function rdpSimplify(pts, epsilon) {
  if (pts.length <= 2) return pts.slice();
  let maxDist = 0;
  let index = 0;
  const first = pts[0];
  const last = pts[pts.length - 1];
  const dx = last.x - first.x;
  const dy = last.y - first.y;
  const len2 = dx * dx + dy * dy;

  for (let i = 1; i < pts.length - 1; i++) {
    const pdx = pts[i].x - first.x;
    const pdy = pts[i].y - first.y;
    let dist;
    if (len2 === 0) {
      dist = Math.sqrt(pdx * pdx + pdy * pdy);
    } else {
      const t = Math.max(0, Math.min(1, (pdx * dx + pdy * dy) / len2));
      const projX = first.x + t * dx;
      const projY = first.y + t * dy;
      dist = Math.sqrt((pts[i].x - projX) ** 2 + (pts[i].y - projY) ** 2);
    }
    if (dist > maxDist) {
      maxDist = dist;
      index = i;
    }
  }

  if (maxDist > epsilon) {
    const left = rdpSimplify(pts.slice(0, index + 1), epsilon);
    const right = rdpSimplify(pts.slice(index), epsilon);
    return left.slice(0, -1).concat(right);
  }

  return [first, last];
}

function canvasSize() {
  return {
    w: Math.max(1, +$('cw').value || 64),
    h: Math.max(1, +$('ch').value || 64),
  };
}

function buildSVG(includeSize) {
  const { w, h } = canvasSize();
  const cx = w / 2 + (+$('dx').value);
  const cy = h / 2 + (+$('dy').value);
  const sx = $('sx').value;
  const sy = $('sy').value;
  const color = $('color').value;
  const text = $('text').value;
  const size = +$('size').value;
  const spacing = +$('spacing').value;
  const font = FONTS[$('font').value];
  const sizeAttrs = includeSize ? ` width="${w}" height="${h}"` : '';

  if ($('path-mode').checked) {
    const d = getTextPath(text, font, size, spacing, w, h);
    if (!d) {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"${sizeAttrs}></svg>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"${sizeAttrs}>
  <path transform="translate(${cx} ${cy}) scale(${sx} ${sy})" d="${d}" fill="${color}" fill-rule="evenodd"/>
</svg>`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"${sizeAttrs}>
  <text transform="translate(${cx} ${cy}) scale(${sx} ${sy})"
        font-family="${font}"
        font-size="${size}"
        letter-spacing="${spacing}"
        fill="${color}"
        text-anchor="middle" dominant-baseline="central">${esc(text)}</text>
</svg>`;
}

function render() {
  for (const id of RANGE_IDS) $(id + '-v').textContent = $(id).value;
  const { w, h } = canvasSize();
  const hasText = $('text').value.length > 0;
  $('stage').innerHTML = fontLoading
    ? '<span class="hint">正在加载字体…</span>'
    : hasText
    ? buildSVG(false)
    : '<span class="hint">在左侧输入文字…</span>';
  const svgEl = $('stage').querySelector('svg');
  if (svgEl) {
    svgEl.style.width = (w * ZOOM) + 'px';
    svgEl.style.height = (h * ZOOM) + 'px';
  }
  $('meta').textContent = hasText ? `画布 ${w} × ${h} · 预览 ${ZOOM}×(${w * ZOOM} × ${h * ZOOM} px)` : '';
  $('code').textContent = hasText && !fontLoading ? buildSVG(true) : '';
  $('download').disabled = !hasText || fontLoading;
  $('copy').disabled = !hasText || fontLoading;
}

function syncOffsetRanges() {
  const { w, h } = canvasSize();
  $('dx').min = -w / 2; $('dx').max = w / 2;
  $('dy').min = -h / 2; $('dy').max = h / 2;
}

document.querySelectorAll('input').forEach(el =>
  el.addEventListener('input', () => {
    if (el.id === 'cw' || el.id === 'ch') syncOffsetRanges();
    render();
  })
);

$('font').addEventListener('change', selectFont);

$('download').addEventListener('click', () => {
  const blob = new Blob([buildSVG(true)], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  const name = $('text').value.trim().replace(/[^\w-]+/g, '_') || 'text';
  a.href = URL.createObjectURL(blob);
  a.download = name + '.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('copy').addEventListener('click', async () => {
  if (!$('text').value) return;
  await navigator.clipboard.writeText(buildSVG(true));
  $('copy').textContent = '已复制!';
  setTimeout(() => { $('copy').textContent = '复制 SVG 代码'; }, 1200);
});

syncOffsetRanges();
render();
</script>
</body>
</html>
